name: Validate GBA reconstruction
on: [push, pull_request, workflow_dispatch]
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build and audit dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi python3-pil python3-numpy libmgba-dev
      - name: Restore and verify embedded assets
        run: python3 tools/unpack_assets.py
      - name: Remove intro playback and recording overlays
        run: python3 tools/clean_frontend.py
      - name: Repair captured sprite borders and palette
        run: python3 tools/repair_sprite_edges.py
      - name: Audit animation palette and foot anchors
        run: python3 tools/audit_motion_assets.py
      - name: Test gameplay with sanitizers
        run: ASAN_OPTIONS=detect_leaks=0 make test
      - name: Verify viewport alignment
        run: python3 tools/audit_positions.py --output build/position-audit.json
      - name: Build native GBA ROM
        run: make
      - name: Run mGBA gameplay and settings integration
        run: |
          gcc -Wall -Wextra -Werror tools/frontend_check.c src/game.c src/level_progress.c -lmgba -o build/frontend_check
          set -o pipefail
          ./build/frontend_check build/sia2_lab.gba | awk '/^PASS / { print; fflush() }' > build/emulator-report.txt
      - name: Convert emulator screenshots to PNG
        run: |
          python3 tools/export_previews.py build
      - name: Package verified build
        run: python3 tools/package_build.py build
      - name: Publish build for testing
        uses: actions/upload-artifact@v4
        with:
          name: Lady-Sia2-GBA-build
          path: build/release/
          if-no-files-found: error
