name: Validate GBA reconstruction
on: [push, pull_request, workflow_dispatch]
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build and audit dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi python3-pil python3-numpy python3-scipy libmgba-dev
      - name: Audit next-route references without inventing a playable map
        run: |
          python3 -m unittest discover -s tests -p test_route_registration.py
          python3 tools/audit_route_continuation.py --output build/route-registration.json
      - name: Restore and verify embedded assets
        run: python3 tools/unpack_assets.py
      - name: Remove intro playback and recording overlays
        run: python3 tools/clean_frontend.py
      - name: Repair captured sprite borders and palette
        run: python3 tools/repair_sprite_edges.py
      - name: Remove residual actor pixels from first-room scenery
        run: |
          python3 tools/clean_room_residue.py
          python3 tools/convert_layers.py
      - name: Verify integrated sixth-view background conversion
        run: python3 tools/convert_continuation_background.py --check
      - name: Verify integrated bridge and riser prototype backgrounds
        run: python3 tools/convert_bridge_run.py --check
      - name: Audit animation palette and foot anchors
        run: |
          python3 tools/convert_jump.py
          python3 tools/convert_clouds.py
          git diff --exit-code -- assets/jump_cycle.bin assets/cloud_strip.bin
          python3 tools/audit_motion_assets.py
      - name: Test gameplay with sanitizers
        run: ASAN_OPTIONS=detect_leaks=0 make test
      - name: Verify viewport alignment
        run: python3 tools/audit_positions.py --output build/position-audit.json
      - name: Build native GBA ROM
        run: make
      - name: Run mGBA gameplay and settings integration
        run: |
          gcc -Wall -Wextra -Werror tools/frontend_check.c src/game.c src/level_progress.c -lmgba -o build/frontend_check
          set -o pipefail
          ./build/frontend_check build/sia2_lab.gba | awk '/^PASS / { print; fflush() }' > build/emulator-report.txt
      - name: Verify settings after closing and reopening a cartridge save
        run: |
          gcc -Wall -Wextra -Werror tools/save_reload_check.c -lmgba -o build/save_reload_check
          set -o pipefail
          ./build/save_reload_check build/sia2_lab.gba | tee -a build/emulator-report.txt
      - name: Convert emulator screenshots to PNG
        run: |
          python3 tools/export_previews.py build
          python3 tools/export_motion_previews.py build
      - name: Package verified build
        run: python3 tools/package_build.py build
      - name: Publish build for testing
        uses: actions/upload-artifact@v4
        with:
          name: Lady-Sia2-GBA-build
          path: build/release/
          if-no-files-found: error
